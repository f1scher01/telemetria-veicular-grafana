apiVersion: 1

datasources:
  - name: InfluxDB_Telemetria
    uid: influxdb_telemetria
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: telemetria_org
      defaultBucket: telemetria
      tlsSkipVerify: true
    secureJsonData:
      token: telemetria-super-secret-token-2026
    editable: false
